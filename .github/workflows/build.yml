name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile flexmassage_tider.py server.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell Portainer to re-pull :latest and redeploy. Only runs if the
      # PORTAINER_WEBHOOK secret is set (Portainer → stack → Webhooks).
      - name: Trigger Portainer redeploy
        if: github.ref == 'refs/heads/main'
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            curl -fsSL -X POST "$WEBHOOK" && echo "Portainer redeploy triggered."
          else
            echo "PORTAINER_WEBHOOK not set — skipping auto-redeploy."
          fi
