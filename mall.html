<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lediga massagetider</title>
<meta name="theme-color" content="#EFEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181A" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/base.css">
<link rel="stylesheet" href="ds/components.css">
<style>
/* App-specific styles only; colours, type and components come from ds/.
   Hjälpmedel: uses the system's default neutral accent (no --accent here). */
.flex-sub { color: var(--dim); font-size: var(--fs-sm); padding: 0 var(--s1); }
.flex-filters { display: flex; flex-direction: column; gap: var(--s3); }
.flex-selects { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--s3); }
.flex-selects > * { min-width: 0; }
.flex-summary { font-size: var(--fs-sm); color: var(--dim); }
.flex-day { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s2); }
.logo svg { width: 22px; height: 22px; }
.flex-day .sech > .pill { flex: none; }
.flex-day .sech small { flex: none; font-weight: 500; letter-spacing: 0; text-transform: none; }
/* The start time is the row's lead: make it read as the primary value */
.row .lead.flex-time { color: var(--text); font-weight: 650; font-size: var(--fs); }
.row .text .flex-who { color: var(--dim); }
.flex-foot { color: var(--dim); font-size: var(--fs-sm); padding: var(--s4) var(--s1) 0; }
</style>

<header class="head-wrap">
  <div class="head">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="17" cy="17" r="11"/><path d="M17 11v6l4 3"/></svg></span>
      <span class="wordmark">Lediga tider</span>
    </div>
  </div>
</header>

<main class="page">
  <p class="flex-sub">Alla bokningsbara tider hos Flexmassage på ett ställe. Senast hämtat <span id="fetched"></span>. Boka på <a href="https://baraboka.se/flexmassage/mobil-new/index.php" target="_blank" rel="noopener">baraboka.se</a>.</p>

  <section class="card pad flex-filters" aria-label="Filter">
    <div class="flex-selects">
      <div><label class="label" for="f-loc">Mottagning</label><select class="select" id="f-loc"></select></div>
      <div><label class="label" for="f-kind">Behandling</label><select class="select" id="f-kind"></select></div>
      <div><label class="label" for="f-staff">Massör</label><select class="select" id="f-staff"></select></div>
    </div>
    <div><span class="label" id="l-len">Minst längd</span><div class="seg" role="group" aria-labelledby="l-len" id="f-len"></div></div>
    <div><span class="label" id="l-day">Dag</span><div class="seg" role="group" aria-labelledby="l-day" id="f-day"></div></div>
    <div class="spread"><span class="flex-summary truncate" id="count"></span><button class="btn ghost sm" id="reset" type="button">Rensa filter</button></div>
  </section>

  <div id="out"></div>

  <p class="flex-foot">Tiderna kan ha hunnit bokas sedan de hämtades. Varje rad visar en starttid; längderna till höger är behandlingarna som går att boka från den tiden.</p>
</main>

<script>
const DATA = /*DATA*/{"hamtat":"","tider":[]}/*END*/;
const CITY = {"NORRA BANTORGET":"Stockholm","SOLNA CENTRUM":"Stockholm","MARIOSGATA":"Kungsbacka","VALANDSPROMENAD":"Kungsbacka","ALINGSÅS":"Övriga orter","BORÅS":"Övriga orter","KUNGÄLV":"Övriga orter","SKÖVDE":"Övriga orter"};
const city = l => CITY[l] || "Göteborg";
const cap = s => s.toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
const kindOf = b => b.replace(/\s*\d+\s*min\s*$/i, "").replace(/\/\s*Bindvävsmassage/i, "").trim();
const lenOf = b => +(b.match(/(\d+)\s*min\s*$/i) || [0, 0])[1];
const DAYS = ["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"];
const MONTHS = ["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"];
const today = new Date().toISOString().slice(0, 10);
const first = s => s.charAt(0).toUpperCase() + s.slice(1);
const shortDay = d => { if (d === today) return "Idag"; const x = new Date(d + "T12:00"); return `${first(DAYS[x.getDay()].slice(0, 3))} ${x.getDate()}/${x.getMonth() + 1}`; };
const dayLabel = d => { const x = new Date(d + "T12:00"); return `${DAYS[x.getDay()]} ${x.getDate()} ${MONTHS[x.getMonth()]}`; };

const rows = DATA.tider.map(t => ({ ...t, kind: kindOf(t.behandling), len: lenOf(t.behandling) }));
function showAge() {
  const mins = Math.round((Date.now() - new Date(DATA.hamtat)) / 60000);
  const age = mins < 1 ? "nyss" : mins < 60 ? `för ${mins} min sedan` : `för ${Math.floor(mins / 60)} h ${mins % 60} min sedan`;
  document.getElementById("fetched").textContent = `${DATA.hamtat.slice(11, 16)} (${age})`;
}
showAge();
setInterval(showAge, 60000);
if (DATA.server) setInterval(async () => {
  try {
    const r = await fetch("flexmassage_tider.json", { cache: "no-store" });
    if (r.ok && (await r.json()).hamtat !== DATA.hamtat) location.reload();
  } catch (e) {}
}, 5 * 60000);

const $ = id => document.getElementById(id);
const uniq = a => [...new Set(a)];
// Filters are either <select> or a .seg of buttons with data-v; these helpers hide the difference.
const isSeg = el => el.classList.contains("seg");
const segBtns = el => [...el.querySelectorAll("button")];
const getV = f => { const el = $(f); return isSeg(el) ? ((segBtns(el).find(b => b.getAttribute("aria-pressed") === "true") || {}).dataset?.v ?? "") : el.value; };
const setV = (f, v) => { const el = $(f); if (isSeg(el)) segBtns(el).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v))); else el.value = v; };
const hasV = (f, v) => { const el = $(f); return isSeg(el) ? segBtns(el).some(b => b.dataset.v === v) : [...el.options].some(o => o.value === v); };
function fill(sel, opts, all) {
  if (isSeg(sel)) {
    sel.innerHTML = `<button type="button" data-v="" aria-pressed="true">${all}</button>` +
      opts.map(o => `<button type="button" data-v="${o.v}" aria-pressed="false">${o.t}</button>`).join("");
    return;
  }
  sel.innerHTML = `<option value="">${all}</option>` + opts.map(o => typeof o === "string"
    ? `<option value="${o}">${o}</option>` : o.group
      ? `<optgroup label="${o.group}">${o.items.map(i => `<option value="${i}">${cap(i)}</option>`).join("")}</optgroup>`
      : `<option value="${o.v}">${o.t}</option>`).join("");
}
const locs = uniq(rows.map(r => r.mottagning));
fill($("f-loc"), ["Stockholm","Göteborg","Kungsbacka","Övriga orter"].map(c => ({ group: c, items: locs.filter(l => city(l) === c).sort() })).filter(g => g.items.length), "Alla");
fill($("f-kind"), uniq(rows.map(r => r.kind)).sort(), "Alla");
fill($("f-len"), uniq(rows.map(r => r.len)).sort((a, b) => a - b).map(n => ({ v: String(n), t: `${n} min` })), "Alla");
fill($("f-staff"), uniq(rows.map(r => r.massor)).sort((a, b) => a.localeCompare(b, "sv")), "Alla");
fill($("f-day"), uniq(rows.map(r => r.datum)).sort().map(d => ({ v: d, t: shortDay(d) })), "Alla");

const F = ["f-loc","f-kind","f-len","f-staff","f-day"];
try { const s = JSON.parse(localStorage.getItem("flex-filter") || "{}"); F.forEach(f => { if (s[f] && hasV(f, s[f])) setV(f, s[f]); }); } catch (e) {}

function render() {
  const [loc, kind, len, staff, day] = F.map(getV);
  try { localStorage.setItem("flex-filter", JSON.stringify(Object.fromEntries(F.map(f => [f, getV(f)])))); } catch (e) {}
  const hit = rows.filter(r => (!loc || r.mottagning === loc) && (!kind || r.kind === kind) && (!len || r.len >= +len)
    && (!staff || r.massor === staff) && (!day || r.datum === day));
  const slots = new Map();
  for (const r of hit) {
    const k = [r.datum, r.start, r.mottagning, r.massor, r.kind].join("|");
    if (!slots.has(k)) slots.set(k, { ...r, lens: new Set() });
    slots.get(k).lens.add(r.len);
  }
  const byDay = new Map();
  [...slots.values()].sort((a, b) => (a.datum + a.start + a.mottagning).localeCompare(b.datum + b.start + b.mottagning, "sv"))
    .forEach(s => { if (!byDay.has(s.datum)) byDay.set(s.datum, []); byDay.get(s.datum).push(s); });
  $("count").textContent = `${slots.size} starttider på ${byDay.size} dagar`;
  $("out").innerHTML = byDay.size ? [...byDay].map(([d, list]) => `
    <section class="flex-day"><h2 class="sech"><span>${first(dayLabel(d))}</span>${d === today ? '<span class="pill acc">Idag</span>' : ""}<small>${list.length} tider</small></h2>
    <div class="card">${list.map(s => `<div class="row"><span class="lead flex-time">${s.start}</span>
      <span class="main"><span class="text">${cap(s.mottagning)} <span class="flex-who">· ${s.massor}</span></span><span class="meta">${s.kind}</span></span>
      <span class="trail">${[...s.lens].sort((a, b) => a - b).join(" · ")} min</span></div>`).join("")}</div></section>`).join("")
    : `<div class="card empty"><b>Inga lediga tider</b>Prova att ta bort ett filter.</div>`;
}
F.forEach(f => $(f).addEventListener(isSeg($(f)) ? "click" : "change", e => {
  if (isSeg($(f))) { const b = e.target.closest("button"); if (!b) return; setV(f, b.dataset.v); }
  render();
}));
$("reset").addEventListener("click", () => { F.forEach(f => setV(f, "")); render(); });
render();
</script>
