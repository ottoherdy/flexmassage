services:
  flexmassage:
    image: ghcr.io/ottoherdy/flexmassage:latest
    container_name: flexmassage
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Stockholm}
      - INTERVALL_MIN=${INTERVALL_MIN:-30}
      - DAGAR=${DAGAR:-14}
      - MOTTAGNINGAR=${MOTTAGNINGAR:-GÖTAPLATSEN,ALMEDAL,MÖLNDALS CENTRUM,PEDAGOGEN PARK MÖLNDAL}
    ports:
      - "8791:8080"
    networks:
      edge:
        aliases: [flexmassage]

networks:
  edge:
    external: true
